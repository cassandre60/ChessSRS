# Fast gate lane: referee integrity, spec traceability, and drift ratchets.
# The product suite (format/analyze/flutter test) stays in test.yml, which
# remains the authority on "the suite is green". This workflow enforces what
# it cannot: that no PR quietly redefines what "passing" means.
#
# Design notes:
# - Gate scripts run from the TRUSTED base checkout (../trusted), never from
#   the PR tree, so a PR cannot tamper with its own judges. The one exception
#   is the bootstrap PR that introduces the gates: the base has no scripts
#   yet, so the workflow falls back to the PR tree with a visible warning and
#   judges under owner review (G07 still flags every referee edit there).
# - `docs/**` (except SPEC/GATES/strategy docs, which are named explicitly) is
#   deliberately absent from the paths filter: a change touching only prose
#   docs skips CI, preserving the cheap docs lane documented in AGENTS.md.
# - G07 approval path: the owner adds the `gate-approved` label to a
#   gate-change/spec-change PR after review; only then do referee edits pass.
# - Merge-queue entries (2026-10-23): the queue re-runs the gates against the
#   batch that is about to land, so this workflow must trigger on `merge_group`
#   and must report "T1 fast gates" there -- a filtered-out required check would
#   leave the queue waiting forever (G-CIREPORT again). G07 alone stays PR-time:
#   it is a per-PR reviewer decision read from that PR's labels, and a group is
#   several PRs with no single label set. It is not skipped in effect -- a PR
#   cannot be enqueued until its own required checks are green, so the
#   protected-path decision was already made and approved on the PR's head, and
#   the batch adds no protected edit of its own. G03/G05/G08/G10 run against
#   the batch, which is exactly what the queue is for. Comparison against the
#   group's own base (not a newer origin/main) keeps the judgment on the batch.
# - The prose-docs bullet above was true until 2026-10-14 and is not any more:
#   `**.md` and `docs/**` were added to the filters below so that a docs-only PR
#   still reports both required checks. Those PRs are now cheap for the suite
#   lane rather than for this one (see test.yml's docs-only fast lane).
# - Nightly recall judges each red-team patch delta only
#   (BASE_REF = the checkout SHA), so the gate commit itself is not re-judged.

name: Gates

on:
  pull_request:
    # `labeled` is load-bearing: the G07 approval path depends on the owner
    # adding the `gate-approved` label re-running these gates (G-LABELEVENT).
    # Without it the label fires no event and `gh run rerun` replays the
    # pre-label payload, so approval could only land via close/reopen.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'scripts/**'
      - '.gates/**'
      - 'redteam/**'
      - 'SPEC.md'
      - 'GATES.md'
      - 'GATES_PLAN.md'
      - 'QUALITY.md'
      - 'TEST_STRATEGY.md'
      - 'PRODUCT.md'
      # AGENTS.md's loop tells every contributor to record what shipped in
      # IMPLEMENTATION_PLAN.md. Without it here, a PR touching only that file runs neither
      # this workflow nor test.yml, so the required "T1 fast gates" check never reports and
      # branch protection blocks the merge permanently -- admin override included, because
      # the check is "expected" and never arrives. Named individually rather than `**.md`:
      # the cheap prose lane is deliberate (see docs-check.yml), and only this file records
      # what shipped and what stays open.
      - 'IMPLEMENTATION_PLAN.md'
      - 'MVP.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CODEOWNERS'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'build.yaml'
      - '.github/**'
      - 'verify'
      # Docs and Markdown, added 2026-10-14. A PR touching only these used to run no
      # workflow at all, so the required "T1 fast gates" never reported and the merge
      # was blocked permanently — not failed, blocked, waiting on something that could
      # never arrive. GitHub refuses that override for admins too. The failure mode is
      # the real argument: it looks like a failing test, so the instinct is to go fix
      # tests that never ran, and the only clue is this file's trigger list.
      #
      # Cost is ~30s of gates on a docs PR. Paying it is cheaper than the alternative,
      # which was editing a file one had no reason to edit so this workflow would fire.
      - '**.md'
      - 'docs/**'
    branches:
      - main
  # Merge-queue entries (gh-readonly-queue/main/*): no `paths` filter is
  # supported on this event, and the queue needs these checks to report against
  # the batched tree before it can merge it.
  merge_group:
  schedule:
    - cron: '0 3 * * *' # nightly red-team recall
  workflow_dispatch:

permissions: read-all

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: T1 fast gates
    # merge_group entries run the same gates against the batch that will land;
    # the nightly build keeps its own job below.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: pr
          fetch-depth: 0

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: trusted
          fetch-depth: 0

      - name: Resolve the comparison base
        id: base
        run: |
          # merge_group has no pull_request payload and github.base_ref is empty
          # there, so read the ref from the event itself.
          ref="${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || 'main' }}"
          ref="${ref#refs/heads/}"
          echo "branch=$ref" >> "$GITHUB_OUTPUT"
          # A group is built on a specific main commit; comparing against that
          # one (not a possibly newer origin/main) keeps the gates judging the
          # batch rather than main's later commits.
          base="${{ github.event.merge_group.base_sha }}"
          if [ -z "$base" ]; then base="origin/$ref"; fi
          echo "BASE_REF=$base" >> "$GITHUB_ENV"
          echo "judging against $base"

      - name: Locate gate scripts (trusted base copy; PR tree on bootstrap)
        working-directory: pr
        run: |
          if [ -f ../trusted/scripts/gates/banned_apis_check.py ]; then
            echo "TRUSTED=../trusted" >> "$GITHUB_ENV"
            echo "using trusted base copy of the gate scripts"
          else
            echo "TRUSTED=." >> "$GITHUB_ENV"
            echo "::warning::trusted gate scripts absent on base (bootstrap PR); judging with the PR tree under owner review"
          fi

      - name: G03 banned APIs in core
        working-directory: pr
        run: python3 "$TRUSTED/scripts/gates/banned_apis_check.py" --config "$TRUSTED/.gates/banned-apis.json" --root .

      - name: G07 protected paths (referee edits need approval)
        # PR-time only: a per-PR reviewer decision, read from that PR's labels.
        # A merge group is several PRs at once with no single label set, and a
        # PR cannot be enqueued before its own checks passed, so each member's
        # protected edit was already reviewed and approved on its own head.
        if: github.event_name == 'pull_request'
        working-directory: pr
        run: |
          APPROVAL=""
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'gate-approved') }}" = "true" ]; then
            APPROVAL="--approved"
          fi
          python3 "$TRUSTED/scripts/gates/protected_paths_check.py" \
            --base "$BASE_REF" --patterns "$TRUSTED/.gates/protected-paths.txt" $APPROVAL

      - name: G08 test-weakening tripwire
        working-directory: pr
        run: python3 "$TRUSTED/scripts/gates/test_weakening_check.py" --base "$BASE_REF"

      - name: G05 spec traceability
        working-directory: pr
        # Citations are judged against the PR spec (one PR may add an
        # invariant with its test); coverage is enforced against the union
        # with the base spec (a PR cannot dodge by deleting; G-BASEINV).
        run: python3 "$TRUSTED/scripts/gates/spec_trace_check.py" --spec SPEC.md --tests test --base-spec "$TRUSTED/SPEC.md"

      - name: G10 ratchets
        working-directory: pr
        run: |
          python3 "$TRUSTED/scripts/gates/collect_metrics.py" --out metrics.json
          python3 "$TRUSTED/scripts/gates/ratchet_check.py" \
            --baseline "$TRUSTED/.gates/ratchet-baseline.json" --current metrics.json

  nightly:
    name: T3 red-team recall
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Red-team corpus recall (must reject every case)
        run: BASE_REF="$GITHUB_SHA" python3 scripts/gates/redteam_runner.py --gate-cmd "./scripts/gates.sh t1"
