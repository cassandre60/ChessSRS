name: Release

# Automatic shippable builds. Cutting a release is pushing a tag; everything
# else is automatic:
#   git tag v0.1.0 && git push origin v0.1.0
# Tagging is the deliberate act — every commit does NOT cut a release (version
# spam, burned CI minutes, meaningless versions). Manual dispatch builds the
# same artifacts without publishing, for proof.
#
# Ships today: Linux tarball (shippable as-is), Android AAB + APK
# (throwaway-signed, testing only — the permanent upload key lives with the
# owner and must never enter this repo; see release-proof.yml header).
# Not shipped: iOS (no signing certs), web (native database/engine have no
# web builds yet), Windows/macOS (no platform directories exist).
#
# Safety: main only merges green PRs (branch protection), so a tag on main
# is already tested — this workflow does not re-run the suite, it ships.
#
# The tag is the only version ledger. Each build is stamped with
# --build-name/--build-number, which is what ends up in the About screen
# (linux: flutter_assets/version.json; android: versionName/versionCode) and
# what the Play Store reads for versionCode. pubspec.yaml is therefore NOT
# bumped per release and must never be treated as the released version: when
# it was, v1.5.0 through v1.6.2 shipped telling the owner they were v1.4.0.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # libsecret-1-dev: flutter_secure_storage_linux links libsecret at
          # CMake configure time (v0.1.0 failed without it).
          sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - name: 🐦 Install flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build

      - name: 🏷️ Resolve the version to stamp into the build
        id: version
        run: bash .github/scripts/release-version.sh

      - name: Build Linux release
        run: |
          flutter build linux --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.build_number }}"

      - name: 🧾 Check the bundle reports this release's version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/verify-linux-version.sh

      - name: Package Linux formats (tarball, deb, AppImage)
        run: |
          # The file-safe name from the resolve step, never GITHUB_REF_NAME: on
          # a manual dispatch that is a branch name, and its slashes made the
          # tarball path a directory that does not exist, failing the dry run.
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p dist

          # 1. Standard portable tarball
          tar -czf "dist/chesssrs-${TAG}-linux-x64.tar.gz" -C build/linux/x64/release bundle

          # 2. Native Debian / Ubuntu package
          bash packaging/linux/build_deb.sh build/linux/x64/release/bundle "${TAG}" dist

          # 3. Standalone AppImage
          bash packaging/linux/build_appimage.sh build/linux/x64/release/bundle "${TAG}" dist

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6.0.0
        with:
          name: linux-packages
          path: dist/*
          retention-days: 14

  android:
    name: Android release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: ☕ Install Java 17
        uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: 🐦 Install flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build

      - name: Configure Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring permanent release keystore from secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=/tmp/release.keystore\n' \
              "${KEYSTORE_PASSWORD}" "${KEY_PASSWORD}" "${KEY_ALIAS}" \
              > android/key.properties
          else
            echo "No permanent key configured; generating throwaway key."
            keytool -genkeypair -keystore /tmp/throwaway.keystore \
              -alias upload -keyalg RSA -keysize 2048 -validity 30 \
              -storepass throwaway -keypass throwaway \
              -dname "CN=Throwaway, OU=CI, O=CI, L=CI, ST=CI, C=DE"
            printf 'storePassword=throwaway\nkeyPassword=throwaway\nkeyAlias=upload\nstoreFile=/tmp/throwaway.keystore\n' \
              > android/key.properties
          fi

      - name: 🏷️ Resolve the version to stamp into the build
        id: version
        run: bash .github/scripts/release-version.sh

      - name: Build release app bundle
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.build_number }}"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.build_number }}"

      - name: 🧾 Check the APK reports this release's version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: bash .github/scripts/verify-android-version.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v6.0.0
        with:
          name: android-testing
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # gh release create needs git context (tag resolution, generated notes).
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v6.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Collect and rename artifacts per tag
        # download-artifact with merge-multiple preserves each upload's
        # directory layout, so locate by filename instead of assuming dist/.
        run: |
          TAG="${GITHUB_REF_NAME}"
          AAB=$(find dist -name 'app-release.aab' -o -name '*.aab' | head -1)
          APK=$(find dist -name 'app-release.apk' -o -name '*.apk' | head -1)
          TGZ=$(find dist -name 'chesssrs-*.tar.gz' | head -1)
          DEB=$(find dist -name '*.deb' | head -1)
          APPIMAGE=$(find dist -name '*.AppImage' | head -1)
          test -n "$AAB" && test -n "$APK" && test -n "$TGZ" || { echo "missing core artifacts:"; find dist -type f; exit 1; }
          mkdir -p release
          mv "$AAB" "release/chesssrs-${TAG}-android.aab"
          mv "$APK" "release/chesssrs-${TAG}-android.apk"
          mv "$TGZ" "release/chesssrs-${TAG}-linux-x64.tar.gz"
          if [ -n "$DEB" ]; then
            CLEAN_TAG="${TAG#v}"
            mv "$DEB" "release/chesssrs_${CLEAN_TAG}_amd64.deb"
          fi
          if [ -n "$APPIMAGE" ]; then
            mv "$APPIMAGE" "release/chesssrs-${TAG}-x86_64.AppImage"
          fi

          # Generate cryptographic SHA256 checksums
          cd release
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Compose release notes
        # Generated notes plus the permanent file guide, so every release
        # explains its own downloads without a manual edit afterwards.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${GITHUB_REF_NAME}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq .body > notes.md
          cat >> notes.md <<EOF

          ## Which file do I download?

          - **Linux AppImage** (\`chesssrs-${GITHUB_REF_NAME}-x86_64.AppImage\`) — single-click portable executable for all Linux distributions.
          - **Linux Debian / Ubuntu** (\`chesssrs_${GITHUB_REF_NAME#v}_amd64.deb\`) — native graphical installer for Ubuntu, Debian, Linux Mint, Pop!_OS.
          - **Linux Tarball** (\`chesssrs-${GITHUB_REF_NAME}-linux-x64.tar.gz\`) — portable unpack-and-run archive.
          - **Android APK** (\`chesssrs-${GITHUB_REF_NAME}-android.apk\`) — installs directly on your Android phone. Permanently signed with developer release key.
          - **Android AAB** (\`chesssrs-${GITHUB_REF_NAME}-android.aab\`) — Google Play Store-upload format.
          - **SHA256SUMS.txt** — cryptographic checksums to verify download authenticity.
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Beta: marked pre-release until the owner declares stable.
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --prerelease
