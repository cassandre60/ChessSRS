name: Runtime smoke

# Runs the real app on a real engine (Linux desktop, under a virtual display) and
# drives a full import -> review -> persist loop. Dispatch-only, plus an optional
# run on a published release: xvfb + software GL is slow and can flake, so this is
# "proof the app runs", not a per-PR gate. See integration_test/app_smoke_test.dart
# and TEST_STRATEGY §4.

on:
  # Manual runs, any time after this file reaches main.
  workflow_dispatch:
  # Once per release: an actual launch is worth having when something ships.
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-smoke:
    name: Linux runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux desktop and display dependencies
        run: |
          sudo apt-get update
          # The desktop toolchain matches release.yml; xvfb + Mesa's software
          # rasterizer give a headless GL surface (runners have no GPU).
          sudo apt-get install -y --no-install-recommends \
            clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            xvfb mesa-utils libgl1-mesa-dri libgles2

      - name: 🐦 Install flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build

      - name: ▶ Run the app smoke on a virtual display
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: 'llvmpipe'
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            flutter test integration_test/app_smoke_test.dart -d linux
