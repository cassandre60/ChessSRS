name: Runtime smoke

# Runs the real app on a real engine (Linux desktop, under a virtual display) and
# drives a full import -> review -> persist loop. It runs on demand, on the PR
# that changes it, and once per release (called from release.yml after the
# artifacts publish): xvfb + software GL is slow and can flake, so this is
# "proof the app runs", not a per-PR gate. See integration_test/app_smoke_test.dart
# and TEST_STRATEGY §4.

on:
  # Manual runs, any time after this file reaches main.
  workflow_dispatch:
  # The PR that adds or changes this smoke carries its own run. GitHub only
  # allows workflow_dispatch once the file is on the default branch, so this is
  # also how a new smoke is exercised before it merges.
  pull_request:
    paths:
      - '.github/workflows/runtime-smoke.yml'
      - 'integration_test/**'
  # Once per release, invoked by release.yml's `runtime-smoke` job.
  #
  # Not `release: [published]`: the Release workflow publishes with the built-in
  # token, and GitHub never starts a workflow from an event that token created
  # (anti-recursion), so that trigger never fired for a real release (verified
  # on v1.9.0, 2026-11-05). A direct call is explicit and testable.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-smoke:
    name: Linux runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux desktop and display dependencies
        run: |
          sudo apt-get update
          # The desktop toolchain matches release.yml; xvfb + Mesa's software
          # rasterizer give a headless GL surface (runners have no GPU).
          sudo apt-get install -y --no-install-recommends \
            clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            xvfb mesa-utils libgl1-mesa-dri libgles2

      - name: 🐦 Install flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build

      - name: ▶ Run the app smoke on a virtual display
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: 'llvmpipe'
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            flutter test integration_test/app_smoke_test.dart -d linux
