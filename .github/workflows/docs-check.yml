name: Docs Check

# A dedicated check for documentation/markdown-only pull requests, as specified in AGENTS.md:
# "If a docs change ever does need a check, add a small dedicated workflow triggered on **.md;
# do not widen the test job's filter just to make a doc edit look verified."
#
# This job used to be *named* "Unit tests on ubuntu-latest" so that a docs-only PR would satisfy
# the required check of that name. That backfired. Any PR touching both code and Markdown fires
# this workflow and test.yml, so two unrelated checks reported the same name — as seen on PR #93,
# where `gh pr checks` listed "Unit tests on ubuntu-latest" twice: this job's 3-second echo and
# the real ~6-minute suite, still queued. Branch protection matches required checks by name, so
# the 3-second echo can satisfy the requirement on its own: a code change could merge having run
# no tests at all. Observed on #93 on 2026-10-13.
#
# The name is now distinct. What that does and does not buy:
#   - It closes the hole. A code+docs PR can no longer be satisfied by this job.
#   - It does NOT make docs-only PRs mergeable, and that is not a regression. gates.yml's paths
#     exclude docs/**, so a docs-only PR still has no "T1 fast gates" report and is still blocked.
#     It was already blocked, because test.yml excludes docs/** too and this job was only ever
#     satisfying half of the two required checks. test.yml's header says as much: "a docs-only
#     PR still gets no CI and cannot merge on its own".
#
# The real suite's check is named "Tests" (#107), so this workflow no longer collides
# with anything branch protection requires. Nothing here is required: a docs-only PR is
# still blocked, because gates.yml excludes docs/** and therefore never reports
# "T1 fast gates".

on:
  push:
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/docs-check.yml'
    branches:
      - main
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/docs-check.yml'
    branches:
      - main

permissions: read-all

jobs:
  docs-check:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge docs-only change
        run: echo "Markdown/docs-only change; unit tests not required."
