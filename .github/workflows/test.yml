name: Tests

# The path filter lists every input the job below actually reads, so that a change to one of
# them cannot skip verification. Each entry earns its place:
#   analysis_options.yaml  sets the dart format page width and the lint set
#   pubspec.lock           dependency resolution
#   build.yaml             build_runner configuration
#   assets/**              maia_book_asset_test.dart loads these through rootBundle
#   scripts/**             update_openings_db_test.dart executes the python script
# The referee files below are listed even though no step reads them: branch protection
# requires the "Unit tests" report on every PR, and a workflow that never triggers leaves
# that check permanently "expected", which blocks the merge for everyone including admins
# (G-CIREPORT: this froze PRs #133-#135 despite green gates). A redundant run on these rare
# PRs is the price of a mergeable repo.
# 'docs/**' and '**.md' were added 2026-10-14, reversing the decision recorded above.
# That decision was defensible when it was made — no step below reads a Markdown file, so
# a full run would spend minutes confirming what cannot fail. It stopped being the right
# trade as soon as the two required checks diverged: branch protection requires BOTH
# "T1 fast gates" and "Tests", so a docs-only PR that triggers neither is blocked
# permanently. Adding the trigger to gates.yml alone does not fix it, because "Tests" is
# then just as missing as "T1 fast gates" was.
#
# So the price is a ~6-minute suite run on a docs-only PR. That is real and is accepted.
# The alternatives were worse: editing a file with no reason to edit it so a workflow
# would fire, or having the no-op Docs Check job impersonate the suite's check name — the
# second is exactly the collision closed in #95 and #107, and reintroducing it would let a
# code PR merge on a check that ran nothing.
# IMPLEMENTATION_PLAN.md joins the referee docs above for the same reason and was
# missed: gates.yml triggers on it, test.yml did not, so a PR touching it produced
# "T1 fast gates" and no "Unit tests" report. Before #95 renamed Docs Check, the
# docs-check job happened to emit the required check's name and covered for this by
# accident — which is exactly the impersonation #95 removed. The gap was latent
# until a real PR hit it. A redundant full run on a rare PR is the same trade as
# the referee docs above; leaving the check permanently "expected" is not.
#
# 2026-10-23: the docs-only cost accepted above is no longer paid, and
# merge-queue entries are supported. Both come from what the 16-PR audit wave
# measured on this repo: strict protection invalidates every other green branch
# on each merge, so one wave cost ~2h of wall clock and the docs PRs in it were
# pure overhead.
#
#   1. Docs-only fast lane. This job still runs and still reports "Tests" —
#      never a stand-in wearing the name (see #95/#107 above). After checkout it
#      classifies the committed diff with .github/scripts/ci-docs-only.sh, run
#      from the base checkout so a PR cannot neuter its own judge, and skips the
#      Flutter steps only when every changed path is Markdown under docs/. Root
#      Markdown deliberately does NOT qualify: enforcement_matrix_test.dart
#      parses TEST_STRATEGY.md, so a root .md edit can genuinely break this
#      suite. Anything outside docs/** — code, workflows, pngs, root docs — runs
#      everything, and any classification failure resolves to the full run.
#      The classifier is unit-tested on every PR by ci-docs-only-test.sh,
#      because a classifier that starts answering "true" for code would skip
#      every test in the repo and nothing else would notice.
#   2. on: merge_group, so a merge queue can gate the batched tree before it
#      lands. No paths filter is possible on that event, which is fine: the
#      classifier keeps a prose-only group cheap, everything else runs in full,
#      and the check always reports (a required check that never arrives is the
#      G-CIREPORT freeze this header already warns about).
# Keep the push and pull_request filters identical.
on:
  push:
    paths:
      - 'lib/**'
      - '!lib/l10n/**'
      - 'test/**'
      - 'assets/**'
      - 'scripts/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'build.yaml'
      - '.github/**'
      - '.gates/**'
      - 'redteam/**'
      - 'SPEC.md'
      - 'GATES.md'
      - 'GATES_PLAN.md'
      - 'QUALITY.md'
      - 'TEST_STRATEGY.md'
      - 'PRODUCT.md'
      - 'MVP.md'
      - 'ARCHITECTURE.md'
      - 'IMPLEMENTATION_PLAN.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CODEOWNERS'
      - 'verify'
      # Docs-only PRs need this workflow to trigger, not for coverage — no step below
      # reads a Markdown file — but because branch protection requires a check named
      # "Tests" and a workflow that never triggers leaves it permanently "expected".
      - '**.md'
      - 'docs/**'
    branches:
      - main
  pull_request:
    paths:
      - 'lib/**'
      # lib/l10n is generated, but a regeneration-only PR still needs the
      # "Tests" check to exist: branch protection requires it on every PR, and
      # a filtered workflow leaves it permanently "expected" (same reason the
      # docs and spec paths at the end of this list are listed).
      - 'test/**'
      - 'assets/**'
      - 'scripts/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'build.yaml'
      - '.github/**'
      - '.gates/**'
      - 'redteam/**'
      - 'SPEC.md'
      - 'GATES.md'
      - 'GATES_PLAN.md'
      - 'QUALITY.md'
      - 'TEST_STRATEGY.md'
      - 'PRODUCT.md'
      - 'MVP.md'
      - 'ARCHITECTURE.md'
      - 'IMPLEMENTATION_PLAN.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CODEOWNERS'
      - 'verify'
      # Docs-only PRs need this workflow to trigger, not for coverage — no step below
      # reads a Markdown file — but because branch protection requires a check named
      # "Tests" and a workflow that never triggers leaves it permanently "expected".
      - '**.md'
      - 'docs/**'
    branches:
      - main
  # Merge-queue entries. `paths` is not supported on this event, so a queued
  # entry always runs this job; the docs-only classifier inside it decides
  # whether the Flutter steps are needed for the batch.
  merge_group:
  workflow_dispatch:

# Cancel superseded PR runs so only the latest pushed commit is actually tested.
# Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Declare default permissions as read only.
permissions: read-all

# The job's reported name is plain "Tests". It was "Unit tests on ubuntu-latest",
# which collided with the no-op docs-check job and left branch protection
# satisfiable by a check that ran nothing. Renamed in #107; the required-check
# list in the repo settings was updated to match. If you rename this again,
# update the required contexts in the same breath or every PR will block.
jobs:
  unit-test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Trusted copy of the classifier that decides whether this PR runs the
      # suite. Without it, a PR that edits .github/scripts/ci-docs-only.sh would
      # judge itself. The bootstrap PR that introduces the script has no base
      # copy and falls back to the PR tree with a warning -- the same trade
      # gates.yml makes for the gate scripts, under the owner review G07 forces
      # on .github/**.
      - uses: actions/checkout@v7.0.1
        if: github.event_name != 'push'
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: trusted

      - name: Classify the diff (docs-only fast lane)
        id: scope
        if: github.event_name != 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -uo pipefail
          classifier=trusted/.github/scripts/ci-docs-only.sh
          if [ ! -f "$classifier" ]; then
            classifier=.github/scripts/ci-docs-only.sh
            echo "::warning::no trusted classifier on the base (bootstrap PR); judging with the PR tree under owner review"
          fi
          # Every failure below resolves to the full suite: minutes wasted is an
          # acceptable mistake, a wrongly skipped suite is not.
          if [ -z "${BASE_SHA:-}" ] || ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no usable base commit (${BASE_SHA:-none}); running the full suite"
            exit 0
          fi
          git diff --no-renames --name-only "$BASE_SHA" HEAD | tee /tmp/changed-paths.txt
          decision=$(bash "$classifier" < /tmp/changed-paths.txt)
          echo "$decision"
          echo "$decision" >> "$GITHUB_OUTPUT"

      - name: Test the docs-only classifier
        run: |
          scripts=.github/scripts
          if [ -f "trusted/$scripts/ci-docs-only.sh" ]; then scripts="trusted/$scripts"; fi
          bash "$scripts/ci-docs-only-test.sh" "$scripts/ci-docs-only.sh"

      - name: 🐦 Install flutter
        if: steps.scope.outputs.docs_only != 'true'
        uses: subosito/flutter-action@v2.23.0
        with:
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Install requirements for sqflite_common_ffi package
        if: steps.scope.outputs.docs_only != 'true'
        run: sudo apt-get -y install libsqlite3-0 libsqlite3-dev

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: flutter pub get

      # build_runner's asset graph plus the sources it generated, keyed only on
      # the builder versions and build configuration. The graph revalidates
      # every input digest on each run, so a PR whose sources changed
      # regenerates exactly the affected outputs before the suite compiles them:
      # the cache skips work build_runner would have skipped itself and is never
      # trusted for correctness. Measured locally 2026-10-23: cold 79s, warm
      # graph 3s, warm graph after a model edit 27s with the edit correctly
      # present in the regenerated file.
      - name: Restore build_runner's asset graph
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: |
            .dart_tool/build
            **/*.freezed.dart
            **/*.g.dart
            **/*.mocks.dart
          key: codegen-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock', 'build.yaml') }}

      - name: Code generation
        if: steps.scope.outputs.docs_only != 'true'
        run: dart run build_runner build

      - name: Verify formatting
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          dart format --output=none --set-exit-if-changed $(find lib/src -name "*.dart" -not \( -name "*.*freezed.dart" -o -name "*.*g.dart" -o -name "*lichess_icons.dart" \) )
          dart format --output=none --set-exit-if-changed $(find test -name "*.dart" -not \( -name "*.*freezed.dart" -o -name "*.*g.dart" \) )

      - name: Analyze project source
        if: steps.scope.outputs.docs_only != 'true'
        run: flutter analyze

      - name: Run unit tests
        if: steps.scope.outputs.docs_only != 'true'
        run: flutter test

      # Release stamping decides what version the owner sees in the About
      # Release stamping decides what version the owner sees in the About
      # screen; the nightly decides whether a build happens at all. Both fail
      # silently when they are wrong, so their logic is tested on every PR
      # rather than only when a release happens.
      - name: Test release version stamping
        run: bash .github/scripts/release-version-test.sh

      - name: Test the nightly build decision
        run: bash .github/scripts/nightly-decide-test.sh
