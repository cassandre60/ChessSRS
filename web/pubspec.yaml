name: chess_srs_web
description: ChessSRS review screen web embed
version: 0.2.0
environment:
  sdk: ^3.12.2
  flutter: ^3.47.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  riverpod: ^3.4.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  fast_immutable_collections: ^11.2.0
  material_ui: ^1.0.1
  material_symbols_icons: ^4.2960.0
  chessground: ^10.3.0
  dartchess: ^0.14.0
  flutter_svg: ^2.0.17
  intl: ^0.20.3
  crypto: ^3.0.7
  clock: ^1.1.2
  collection: ^1.19.1
  http: ^1.6.0
  file_picker: ^13.1.0
  flutter_markdown_plus: ^1.0.12
  auto_size_text: ^3.0.0
  fl_chart: ^1.2.0
  flutter_layout_grid: ^2.0.8
  logging: ^1.3.0
  material_color_utilities: ^0.13.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - ../assets/fonts/
    - ../assets/figurines/
    - ../assets/pieces/
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: ../assets/fonts/InstrumentSans[wdth,wght].ttf
    - family: Newsreader
      fonts:
        - asset: ../assets/fonts/Newsreader[opsz,wght].ttf
    - family: LichessIcons
      fonts:
        - asset: ../assets/fonts/LichessIcons.ttf
    - family: SocialIcons
      fonts:
        - asset: ../assets/fonts/SocialIcons.ttf
    - family: ChessFont
      fonts:
        - asset: ../assets/fonts/ChessSansPiratf.ttf
    - family: LichessPuzzleIcons
      fonts:
        - asset: ../assets/fonts/PuzzleIcons.ttf
